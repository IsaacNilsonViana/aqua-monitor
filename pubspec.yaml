name: aqua_monitor
description: Aplicativo Android para monitoramento local de qualidade da agua via BLE.
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.3
  flutter_foreground_task: ^11.0.3
  # 5.4.0 usa o Android SDK estavel; 5.6.x exige a plataforma preview 37.
  flutter_reactive_ble: 5.4.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: 12.0.1
  provider: ^6.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2

# As versoes transitivas mais novas passaram a exigir Android API 37 preview.
# Estes pins mantem o APK no SDK Android estavel e sao testados em conjunto.
dependency_overrides:
  permission_handler_android: 13.0.1
  reactive_ble_mobile: 5.4.0
  reactive_ble_platform_interface: 5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

